[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "biotrace-indonesia"
version = "0.1.1"
description = "Mesin verifikasi pendukung data eDNA berbasis aturan"
requires-python = ">=3.11,<3.12"
dependencies = [
  "pydantic>=2.10,<3", "PyYAML>=6,<7", "biopython>=1.85,<2",
  "pandas>=2.2,<3", "fastapi>=0.115,<1", "uvicorn>=0.34,<1",
  "python-multipart>=0.0.20,<1", "reportlab>=4.3,<5",
]

[dependency-groups]
harvest = ["pyarrow>=15"]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1", "httpx>=0.28,<1", "pypdf>=5,<7", "pymupdf>=1.25,<2", "playwright>=1.51,<2"]

[project.scripts]
biotrace = "biotrace_core.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["biotrace_core", "api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: pengujian kinerja dan dataset besar", "blast: memerlukan NCBI BLAST+"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
