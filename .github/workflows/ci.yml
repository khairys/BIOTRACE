# [P1] ruff + pytest without slow tests (05 §12); BLAST from apt so integration tests run.
name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: sudo apt-get update && sudo apt-get install -y ncbi-blast+
      - run: uv sync --frozen
      - run: uv run ruff format --check biotrace_core api scripts tests
      - run: uv run ruff check biotrace_core api scripts tests
      - run: uv run python scripts/export_schemas.py
      - run: git diff --exit-code -- web/src/api
      - run: uv run pytest -m "not slow" -q
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix web
      - run: npm run build --prefix web
